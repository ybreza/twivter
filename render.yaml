# Render.com configuration for Twivter Chat Service
# Render akan auto-detect file ini saat import dari GitHub.
# Docs: https://render.com/docs/blueprint-spec
#
# Cara pakai:
#   1. Push repo ini ke GitHub
#   2. Login ke https://render.com → New + → Blueprint
#   3. Pilih repo twivter → Render akan baca file ini otomatis
#   4. Set env vars (CORS_ORIGINS) di dashboard Render sebelum deploy pertama

services:
  - type: web
    name: twivter-chat
    env: node
    rootDir: mini-services/chat-service
    # Render free tier pakai Node.js (bukan Bun). tsx menjalankan TypeScript
    # langsung tanpa build step.
    buildCommand: npm install
    startCommand: npx tsx index.ts
    envVars:
      - key: NODE_ENV
        value: production
      # CORS_ORIGINS: isi dengan URL frontend Vercel Anda (comma-separated).
      # Contoh: https://twivter-abc123.vercel.app,https://twivter.vercel.app
      - key: CORS_ORIGINS
        sync: false
    # Render free tier: 512 MB RAM, sleep setelah 15 menit idle.
    # Untuk cegah sleep, setup UptimeRobot ping tiap 10 menit ke /health endpoint.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
